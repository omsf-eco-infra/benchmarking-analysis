name: Build site from PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.82.1
          cache: true

      - run: npm --prefix web ci
      - run: pixi run test-static
      - name: Build Astro
        run: pixi run build-astro
      - run: npm --prefix web test

      - name: Install browser for interaction tests
        run: pixi run uv run --no-project --with playwright==1.64.1 playwright install --with-deps chromium
      - name: Check dashboard interactions and layout
        run: pixi run uv run --no-project --with playwright==1.64.1 python tests/browser_dashboard.py

      - name: Make staging artifact
        shell: bash
        # Preserve the artifact contract used by the staging workflow on main.
        run: |
          mkdir -p "$RUNNER_TEMP/site-bundle/output"
          cp -R output-astro/. "$RUNNER_TEMP/site-bundle/output/"
          tar czf site.tar.gz -C "$RUNNER_TEMP/site-bundle" output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: site.tar.gz
          if-no-files-found: error
          retention-days: 1
